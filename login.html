<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>เข้าสู่ระบบ - BookPick</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/responsive.css"></head><body data-page="login"><main class="auth-page"><div class="auth-card"><div class="logo">📚</div><h1>เข้าสู่ระบบ BookPick</h1><p>ยินดีต้อนรับกลับมา</p><form id="login-form"><label>อีเมล<input id="email" type="email" required autocomplete="email"></label><label>รหัสผ่าน<input id="password" type="password" required autocomplete="current-password"></label><button id="login-btn" class="btn primary full" type="submit">เข้าสู่ระบบ</button></form><p class="auth-link">ยังไม่มีบัญชี? <a href="register.html">สมัครสมาชิก</a></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/utils.js"></script><script src="js/auth.js"></script><script>
(async()=>{if(await Auth.user()) location.href="dashboard.html";})();
document.querySelector("#login-form").addEventListener("submit",async e=>{e.preventDefault();const btn=document.querySelector("#login-btn");BP.setLoading(btn,true,"กำลังเข้าสู่ระบบ...");try{await Auth.signIn(document.querySelector("#email").value,document.querySelector("#password").value);location.href=new URLSearchParams(location.search).get("returnTo")||"dashboard.html";}catch(err){BP.toast(err.message==="Email not confirmed"?"อีเมลยังไม่ได้ยืนยัน":"อีเมลหรือรหัสผ่านไม่ถูกต้อง","error");}finally{BP.setLoading(btn,false);}});
</script></body></html>
