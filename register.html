<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>สมัครสมาชิก - BookPick</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/responsive.css"></head><body data-page="register"><main class="auth-page"><div class="auth-card"><div class="logo">📚</div><h1>สร้างบัญชี BookPick</h1><p>เริ่มสร้างนิสัยรักการอ่าน</p><form id="register-form"><label>ชื่อที่แสดง<input id="display-name" required></label><label>อีเมล<input id="email" type="email" required autocomplete="email"></label><label>รหัสผ่าน<input id="password" type="password" minlength="6" required autocomplete="new-password"></label><button id="register-btn" class="btn primary full" type="submit">สมัครสมาชิก</button></form><p class="auth-link">มีบัญชีแล้ว? <a href="login.html">เข้าสู่ระบบ</a></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/utils.js"></script><script src="js/auth.js"></script><script>
document.querySelector("#register-form").addEventListener("submit",async e=>{e.preventDefault();const btn=document.querySelector("#register-btn");BP.setLoading(btn,true,"กำลังสมัคร...");try{const r=await Auth.signUp(document.querySelector("#display-name").value,document.querySelector("#email").value,document.querySelector("#password").value);if(r.session){location.href="dashboard.html";}else{BP.toast("สมัครสำเร็จ กรุณายืนยันอีเมลก่อนเข้าสู่ระบบ","success");setTimeout(()=>location.href="login.html",1200);}}catch(err){BP.toast(err.message,"error");}finally{BP.setLoading(btn,false);}});
</script></body></html>
